name: CI

# Jalan di push ke main (jaga-jaga kalau ada yang push langsung) dan di
# setiap pull request ke main - inilah yang muncul sebagai status check
# di halaman PR, sebelum branch protection mengizinkan merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/repository/sqlcgen/ sengaja di-gitignore (lihat README) -
      # checkout yang bersih seperti di CI tidak punya folder ini sama
      # sekali, jadi harus di-generate ulang sebelum step apapun yang
      # meng-compile kode (test, build).
      #
      # Diambil sebagai binary jadi dari GitHub release, BUKAN `go install`
      # (cara sebelumnya) - sqlc v1.31.1 butuh Go >= 1.26 untuk DIKOMPILASI,
      # sementara go.mod project ini (dan Go yang di-setup step di atas)
      # ada di 1.25 (naik dari 1.22 setelah testcontainers-go ditambahkan,
      # lihat commit terkait). `go install` akan gagal persis seperti yang
      # dulu ketemu di Dockerfile - solusinya sama: pakai binary yang sudah
      # dikompilasi, bukan kompilasi ulang di sini.
      - name: Install sqlc
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | tar -xz -C /usr/local/bin sqlc

      - name: Generate sqlc code
        run: sqlc generate

      # Paling murah/cepat duluan (fail fast): kalau formatting saja
      # belum rapi, tidak ada gunanya lanjut ke test/build.
      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File berikut belum di-gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      # Terpisah dari step Test di atas (lihat build tag "integration" di
      # internal/testhelper, internal/invoice/integration_test.go,
      # internal/job/integration_test.go) - test ini menyalakan Postgres
      # ASLI lewat testcontainers-go untuk membuktikan locking (payment
      # lost-update, assign optimistic-locking conflict) yang tidak bisa
      # dibuktikan pakai fake Repository. ubuntu-latest sudah punya Docker
      # daemon terpasang secara native, tidak perlu setup tambahan.
      # WAJIB lolos di setiap PR (bukan cuma dijalankan manual) - ini yang
      # sebelumnya cuma dibuktikan lewat script sekali pakai yang dihapus
      # dari repo (lihat audit 2026-07-30).
      - name: Integration test (testcontainers-go, real Postgres)
        run: go test -tags=integration ./... -v

      - name: Build
        run: go build ./...
